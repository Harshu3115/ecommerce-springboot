<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Order Confirmed</title>

    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
        }
        .header h2 {
            color: #28a745;
        }
        .content {
            font-size: 15px;
            color: #333;
        }
        .order-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .btn {
            display: inline-block;
            padding: 10px 18px;
            background: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <h2>✅ Order Confirmed!</h2>
    </div>

    <!-- Content -->
    <div class="content">
       <p>Hi <strong th:text="${username}"></strong>,</p>

        <p>Thank you for your order! 🎉 Your order has been successfully placed.</p>

        <!-- Order Details -->
        <div class="order-box">
            <p>Order ID: <span th:text="${orderId}"></span></p>
			<p>Total: ₹<span th:text="${amount}"></span></p>
			<p>Product: <span th:text="${productName}"></span></p>
        </div>

        

        

        <!-- Button -->
        <a href="http://localhost:8080/user/orders" class="btn">
            View Order
        </a>

        <p style="margin-top: 20px;">
            We’ll notify you once your order is shipped 🚚
        </p>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>© 2026 VogueHub. All rights reserved.</p>
    </div>

</div>

</body>
</html>
