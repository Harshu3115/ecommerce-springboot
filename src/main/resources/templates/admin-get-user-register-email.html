<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>New User Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }
        .email-container {
            max-width: 600px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            padding-bottom: 15px;
        }
        .header h2 {
            color: #dc3545;
        }
        .content {
            font-size: 16px;
            color: #333;
        }
        .info-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .btn-admin {
            background-color: #007bff;
            color: white;
            padding: 10px 18px;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="email-container">

    <!-- Header -->
    <div class="header">
        <h2>🚨 New User Registered</h2>
    </div>

    <!-- Content -->
    <div class="content">
        <p>Hello Admin,</p>

        <p>A new user has successfully registered on <strong>VogueHub</strong>.</p>

        <!-- User Info -->
        <div class="info-box">
    <p><strong>Name:</strong> <span th:text="${username}"></span></p>
    <p><strong>Email:</strong> <span th:text="${email}"></span></p>
    <p><strong>Mobile:</strong> <span th:text="${mobile}"></span></p>
    <p><strong>Registration Date:</strong> <span th:text="${date}"></span></p>
</div>

        <!-- Button -->
        <a href="http://localhost:8080/admin/dashboard" class="btn-admin">
            View in Admin Panel
        </a>

        <p style="margin-top: 20px;">
            Please review the user details if necessary.
        </p>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>© 2026 VogueHub Admin Panel</p>
    </div>

</div>

</body>
</html>
