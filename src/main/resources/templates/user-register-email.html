<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Registration Successful</title>

    <!-- Bootstrap CDN (for email, inline styles are safer but this works for most clients) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }
        .email-container {
            max-width: 600px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            padding-bottom: 15px;
        }
        .header h2 {
            color: #28a745;
        }
        .content {
            font-size: 16px;
            color: #333;
        }
        .btn-custom {
            background-color: #007bff;
            color: white;
            padding: 10px 18px;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="email-container">

    <!-- Header -->
    <div class="header">
        <h2>🎉 Registration Successful!</h2>
    </div>

    <!-- Content -->
    <div class="content">
        <p>Hi <strong th:text="${name}"></strong>,</p>

<p>Welcome to <strong>VogueHub</strong>! Your account has been successfully created.</p>

<p>You can now log in and start exploring our platform.</p>

<p><strong>Email:</strong> <span th:text="${email}"></span></p>

        <!-- Button -->
        <a href="http://localhost:8082/login" class="btn-custom">
            Login Now
        </a>

        <p style="margin-top: 20px;">
            If you did not create this account, please ignore this email.
        </p>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>© 2026 VogueHub. All rights reserved.</p>
    </div>

</div>

</body>
</html>
