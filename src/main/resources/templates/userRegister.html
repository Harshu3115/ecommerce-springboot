<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | VogueHub</title>
  <link rel="icon" type="image/png" href="/images/favicon2.png">
  <link rel="shortcut icon" href="/favicon2.png">

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --primary: #4a6cf7;
    --secondary: #9333ea;
    --text: #333;
    --gray: #777;
    --success: #10b981;
    --success-dark: #059669;
    --error: #ef4444;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #e0eafc, #cfdef3);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    position: relative;
}

/* Card */
.card-custom {
    width: 100%;
    max-width: 500px;
    background: #fff;
    padding: 28px;
    border-radius: 10px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    animation: fadeIn 0.5s ease;
    border: none;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Icon */
/* .icon {
    width: 70px;
    height: 70px;
    margin: 0 auto 10px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 32px;
} */

.icon {
    width: 350px;
    margin:auto;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden; 
}

/* Image styling */
.icon img {
    width: 100%;
    height: 100%;
    object-fit: contain; /* keeps logo proper */
}

@media (max-width: 768px) {
    .icon {
        width: 380px;
        height: 80px;
    }
}

@media (max-width: 480px) {
    .icon {
        width: 380px;
        height: 80px;
    }
}

/* Title */
h2 {
    text-align: center;
    margin-top: 10px;
    color: var(--text);
    font-size: 26px;
    font-weight: 700;
}

.subtitle {
    text-align: center;
    font-size: 14px;
    color: var(--gray);
    margin-bottom: 25px;
}

/* Form */
.form-group {
    margin-bottom: 18px;
}

label {
    font-size: 13px;
    margin-bottom: 6px;
    display: block;
    font-weight: 600;
    color: #444;
}

/* Input with icon */
.input-box {
    position: relative;
}

.input-box input {
    width: 100%;
    padding: 13px 45px 13px 45px;
    border-radius: 12px;
    border: 1.5px solid #e2e8f0;
    outline: none;
    transition: all 0.3s;
    font-size: 14px;
    background: #fafbfc;
}

.input-box input:focus {
    border-color: var(--primary);
    background: white;
    box-shadow: 0 0 0 3px rgba(74,108,247,0.1);
}

/* Left icon - always visible */
.input-box .left-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #94a3b8;
    font-size: 16px;
    z-index: 1;
    pointer-events: none;
}

/* Right icon (eye toggle) */
.input-box .toggle-eye {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #94a3b8;
    transition: color 0.3s;
    z-index: 2;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border: none;
}

.input-box .toggle-eye:hover {
    color: var(--primary);
}

/* Checkbox */
.checkbox {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    margin: 15px 0 20px;
}

.checkbox input {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: var(--primary);
}

.checkbox span {
    color: #555;
}

.checkbox a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 500;
}

.checkbox a:hover {
    text-decoration: underline;
}

/* Button */
.btn-custom {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.btn-custom:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(74,108,247,0.3);
    color: white;
}

/* Footer */
.footer {
    text-align: center;
    margin-top: 18px;
    font-size: 14px;
    color: #666;
}

.footer a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
}

.footer a:hover {
    text-decoration: underline;
}

/* Divider */
.divider {
    text-align: center;
    margin: 20px 0 12px;
    font-size: 13px;
    color: #aaa;
    position: relative;
}

.divider::before,
.divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 35%;
    height: 1px;
    background: #e2e8f0;
}

.divider::before {
    left: 0;
}

.divider::after {
    right: 0;
}

.divider span {
    background: white;
    padding: 0 12px;
    position: relative;
    z-index: 1;
}

/* Error message */
.error-message {
    color: var(--error);
    font-size: 11px;
    margin-top: 5px;
    display: none;
    padding-left: 10px;
}

/* Password strength */
.password-strength {
    font-size: 11px;
    margin-top: 6px;
    padding-left: 10px;
    display: none;
}

.strength-weak { 
    color: #ef4444; 
}
.strength-medium { 
    color: #f59e0b; 
}
.strength-strong { 
    color: #10b981; 
}

/* Responsive */
@media (max-width: 480px) {
    .card-custom {
        padding: 24px 20px;
    }
    
    .input-box input {
        padding: 12px 40px 12px 40px;
    }
}

/* Success Popup - Green Box */
.success-popup {
    position: fixed;
    top: 20px;
    right: 20px;
    background: linear-gradient(135deg, #10b981, #059669);
    color: white;
    padding: 16px 24px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 10px 30px rgba(16,185,129,0.3);
    z-index: 10000;
    animation: slideInRight 0.5s ease;
    font-weight: 500;
    min-width: 320px;
    backdrop-filter: blur(5px);
}

.success-popup i {
    font-size: 22px;
}

.success-popup .checkmark {
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    padding: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.success-popup .close-popup {
    margin-left: auto;
    cursor: pointer;
    opacity: 0.8;
    transition: opacity 0.2s;
    font-size: 14px;
}

.success-popup .close-popup:hover {
    opacity: 1;
}

@keyframes slideInRight {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

.popup-fade-out {
    animation: fadeOut 0.5s ease forwards;
}

@keyframes fadeOut {
    to {
        opacity: 0;
        transform: translateX(100%);
    }
}
</style>

</head>

<body>

<div class="card-custom">
    <div class="icon">
    <img src="/images/brand.png" alt="VogueHub" height="100">
    </div>

    <h2>Create Account</h2>
    <p class="subtitle">Join our community of conscious shoppers</p>

    <form id="registerForm" th:action="@{/register}" method="post" th:object="${user}">

        <!-- Full Name -->
        <div class="form-group">
            <label>Full Name <span class="text-danger">*</span></label>
            <div class="input-box">
                <i class="fa-regular fa-user left-icon"></i>
                <input type="text" th:field="*{name}" id="fullName" class="form-control-plaintext" style="padding: 13px 45px 13px 45px; border: 1.5px solid #e2e8f0; border-radius: 12px; background: #fafbfc;" placeholder="Enter your full name" required>
            </div>
        </div>

        <!-- Email Address -->
        <div class="form-group">
            <label>Email Address <span class="text-danger">*</span></label>
            <div class="input-box">
                <i class="fa-regular fa-envelope left-icon"></i>
                <input type="email" th:field="*{email}" id="email" class="form-control-plaintext" style="padding: 13px 45px 13px 45px; border: 1.5px solid #e2e8f0; border-radius: 12px; background: #fafbfc;" placeholder="Enter your email" required>
            </div>
        </div>

        <!-- Phone Number -->
        <div class="form-group">
            <label>Phone Number <span class="text-danger">*</span></label>
            <div class="input-box">
                <i class="fa-solid fa-phone left-icon"></i>
                <input type="tel" th:field="*{phone}" id="phone" class="form-control-plaintext" style="padding: 13px 45px 13px 45px; border: 1.5px solid #e2e8f0; border-radius: 12px; background: #fafbfc;" placeholder="1234567890" required>
            </div>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label>Password <span class="text-danger">*</span></label>
            <div class="input-box">
                <i class="fa-solid fa-lock left-icon"></i>
                <input type="password" th:field="*{password}" id="password" class="form-control-plaintext" style="padding: 13px 45px 13px 45px; border: 1.5px solid #e2e8f0; border-radius: 12px; background: #fafbfc;" placeholder="Create password" required onkeyup="checkPasswordStrength()">
                <span class="toggle-eye" onclick="togglePassword('password')">
                    <i class="fa-regular fa-eye-slash" id="passwordEye"></i>
                </span>
            </div>
            <div class="password-strength" id="passwordStrength"></div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
            <label>Confirm Password <span class="text-danger">*</span></label>
            <div class="input-box">
                <i class="fa-solid fa-lock left-icon"></i>
                <input type="password" id="confirmPassword" class="form-control-plaintext" style="padding: 13px 45px 13px 45px; border: 1.5px solid #e2e8f0; border-radius: 12px; background: #fafbfc;" placeholder="Confirm password" required>
                <span class="toggle-eye" onclick="togglePassword('confirmPassword')">
                    <i class="fa-regular fa-eye-slash" id="confirmPasswordEye"></i>
                </span>
            </div>
            <div class="error-message" id="passwordError">
                <i class="fa-solid fa-circle-exclamation" style="font-size: 10px; margin-right: 4px;"></i> Passwords do not match
            </div>
        </div>
        
        <!-- Address -->
        <div class="form-group">
            <label>Address <span class="text-danger">*</span></label>
            <div class="input-box">
                <i class="fa-solid fa-location-dot left-icon"></i>
                <input type="text" id="address" th:field="*{address}" class="form-control-plaintext" style="padding: 13px 45px 13px 45px; border: 1.5px solid #e2e8f0; border-radius: 12px; background: #fafbfc;" placeholder="Enter your complete address" required>
            </div>
        </div>

        <!-- Terms Checkbox -->
        <div class="checkbox">
            <input type="checkbox" id="termsCheck" required>
            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-custom">
            <i class="fa-regular fa-circle-check"></i> Create Account
        </button>

    </form>

    <div class="footer">
        Already have an account? <a href="/">Sign In</a>
    </div>

    <div class="divider">
        <span>Want to sell products?</span>
    </div>

    <div class="footer">
        <a th:href="@{/seller/register}">
    <i class="fa-solid fa-store"></i> Register as Seller
		</a>
    </div>

</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Toggle password visibility
function togglePassword(id) {
    let input = document.getElementById(id);
    let eyeIcon = id === 'password' 
        ? document.getElementById('passwordEye') 
        : document.getElementById('confirmPasswordEye');
    
    if (input.type === "password") {
        input.type = "text";
        eyeIcon.className = "fa-regular fa-eye";
    } else {
        input.type = "password";
        eyeIcon.className = "fa-regular fa-eye-slash";
    }
}

// Password strength checker (optional UI only)
function checkPasswordStrength() {
    let password = document.getElementById('password').value;
    let strengthDiv = document.getElementById('passwordStrength');

    if (password.length === 0) {
        strengthDiv.style.display = 'none';
        return;
    }

    strengthDiv.style.display = 'block';

    let strength = 0;
    if (password.length >= 6) strength++;
    if (password.length >= 8) strength++;
    if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
    if (password.match(/[0-9]/)) strength++;
    if (password.match(/[^a-zA-Z0-9]/)) strength++;

    if (strength <= 2) {
        strengthDiv.innerHTML = 'Weak password';
        strengthDiv.className = 'password-strength strength-weak';
    } else if (strength <= 4) {
        strengthDiv.innerHTML = 'Medium password';
        strengthDiv.className = 'password-strength strength-medium';
    } else {
        strengthDiv.innerHTML = 'Strong password';
        strengthDiv.className = 'password-strength strength-strong';
    }
}

// Confirm password validation
document.getElementById('confirmPassword').addEventListener('keyup', function() {
    let password = document.getElementById('password').value;
    let confirm = this.value;
    let errorDiv = document.getElementById('passwordError');

    if (confirm.length > 0 && password !== confirm) {
        errorDiv.style.display = 'block';
    } else {
        errorDiv.style.display = 'none';
    }
});
</script>

</body>
</html>
