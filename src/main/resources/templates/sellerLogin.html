<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | VogueHub</title>
<link rel="icon" type="image/png" href="/images/favicon2.png">
<link rel="shortcut icon" href="/favicon2.png">

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --primary: #4a6cf7;
    --secondary: #9333ea;
    --text: #333;
    --gray: #777;
    --success: #10b981;
    --error: #ef4444;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #e0eafc, #cfdef3);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* Card */
.card-custom {
    width: 100%;
    max-width: 450px;
    background: #fff;
    padding: 32px 28px;
    border-radius: 16px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    animation: fadeIn 0.5s ease;
    border: none;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Icon */
.icon {
    width: 280px;
    margin: 0 auto 10px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.icon img {
    width: 100%;
    height: auto;
    object-fit: contain;
}

@media (max-width: 480px) {
    .icon {
        width: 220px;
    }
    .card-custom {
        padding: 24px 20px;
    }
}

/* Title */
h2 {
    text-align: center;
    margin-top: 5px;
    color: var(--text);
    font-size: 26px;
    font-weight: 700;
}

.subtitle {
    text-align: center;
    font-size: 14px;
    color: var(--gray);
    margin-bottom: 28px;
}

/* Form */
.form-group {
    margin-bottom: 20px;
}

label {
    font-size: 13px;
    margin-bottom: 6px;
    display: block;
    font-weight: 600;
    color: #444;
}

/* Input with icon */
.input-box {
    position: relative;
}

.input-box input {
    width: 100%;
    padding: 13px 45px 13px 45px;
    border-radius: 12px;
    border: 1.5px solid #e2e8f0;
    outline: none;
    transition: all 0.3s;
    font-size: 14px;
    background: #fafbfc;
}

.input-box input:focus {
    border-color: var(--primary);
    background: white;
    box-shadow: 0 0 0 3px rgba(74,108,247,0.1);
}

/* Left icon */
.input-box .left-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #94a3b8;
    font-size: 16px;
    z-index: 1;
    pointer-events: none;
}

/* Right icon (eye toggle) */
.input-box .toggle-eye {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #94a3b8;
    transition: color 0.3s;
    z-index: 2;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border: none;
}

.input-box .toggle-eye:hover {
    color: var(--primary);
}

/* Forgot Password */
.forgot-password {
    text-align: right;
    margin-bottom: 20px;
}

.forgot-password a {
    font-size: 12px;
    color: var(--primary);
    text-decoration: none;
    font-weight: 500;
}

.forgot-password a:hover {
    text-decoration: underline;
}

/* Button */
.btn-custom {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 5px;
}

.btn-custom:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(74,108,247,0.3);
    color: white;
}

/* Footer */
.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #666;
}

.footer a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
}

.footer a:hover {
    text-decoration: underline;
}

/* Divider */
.divider {
    text-align: center;
    margin: 20px 0 16px;
    font-size: 13px;
    color: #aaa;
    position: relative;
}

.divider::before,
.divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 42%;
    height: 1px;
    background: #e2e8f0;
}

.divider::before {
    left: 0;
}

.divider::after {
    right: 0;
}

.divider span {
    background: white;
    padding: 0 12px;
    position: relative;
    z-index: 1;
}

/* Social Login Buttons */
.social-buttons {
    display: flex;
    gap: 12px;
    margin-top: 15px;
}

.social-btn {
    flex: 1;
    padding: 10px;
    border-radius: 12px;
    border: 1.5px solid #e2e8f0;
    background: white;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
    color: #555;
    text-decoration: none;
}

.social-btn:hover {
    border-color: var(--primary);
    background: #faf5ff;
    transform: translateY(-2px);
}

.social-btn i {
    font-size: 18px;
}

.social-btn .fa-google {
    color: #ea4335;
}

.social-btn .fa-facebook {
    color: #1877f2;
}

/* Error Message */
.error-message {
    color: var(--error);
    font-size: 11px;
    margin-top: 5px;
    display: none;
    padding-left: 10px;
}

/* Success Popup */
.success-popup {
    position: fixed;
    top: 20px;
    right: 20px;
    background: linear-gradient(135deg, #10b981, #059669);
    color: white;
    padding: 16px 24px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 10px 30px rgba(16,185,129,0.3);
    z-index: 10000;
    animation: slideInRight 0.5s ease;
    font-weight: 500;
    min-width: 280px;
}

.success-popup i {
    font-size: 20px;
}

@keyframes slideInRight {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}
</style>
</head>

<body>

<div class="card-custom">
    <div class="icon">
        <img src="/images/brand.png" alt="VogueHub">
    </div>

    <h2>Welcome Back</h2>
    <p class="subtitle">Login to your VogueHub account</p>

    <form action="/seller/login" method="post">
    
    <!-- ✅ Error message -->
    <div th:if="${error}" style="color:red; text-align:center; margin-bottom:10px;">
        <p th:text="${error}"></p>
    </div>
        
        <!-- Email Address -->
        <div class="form-group">
            <label>Email Address <span class="text-danger">*</span></label>
            <div class="input-box">
                <i class="fa-regular fa-envelope left-icon"></i>
                <input type="email" name="email" id="email" placeholder="Enter your email" required>
            </div>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label>Password <span class="text-danger">*</span></label>
            <div class="input-box">
                <i class="fa-solid fa-lock left-icon"></i>
                <input type="password" name="password" id="password" placeholder="Enter your password" required>
                <span class="toggle-eye" onclick="togglePassword()">
                    <i class="fa-regular fa-eye-slash" id="passwordEye"></i>
                </span>
            </div>
        </div>

        <!-- Forgot Password -->
        <div class="forgot-password">
            <a href="/forgot-password">Forgot Password?</a>
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn-custom">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
        </button>

    </form>

    <!-- Divider -->
    <div class="divider">
        <span>Or continue with</span>
    </div>

    <!-- Social Login Buttons -->
    <div class="social-buttons">
        <a href="/oauth2/authorization/google" class="social-btn">
            <i class="fab fa-google"></i> Google
        </a>
        <a href="/oauth2/authorization/facebook" class="social-btn">
            <i class="fab fa-facebook"></i> Facebook
        </a>
    </div>

    <div class="footer">
        Don't have an account? <a href="/seller/register">Create Account</a>
    </div>

    <div class="footer" style="margin-top: 10px;">
        <a href="/">
            <i class="fa-solid fa-store"></i> Login as Customer
        </a>
    </div>

</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Toggle password visibility
function togglePassword() {
    let passwordInput = document.getElementById('password');
    let eyeIcon = document.getElementById('passwordEye');
    
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeIcon.className = "fa-regular fa-eye";
    } else {
        passwordInput.type = "password";
        eyeIcon.className = "fa-regular fa-eye-slash";
    }
}

// Simple form validation (optional)
document.getElementById('loginForm').addEventListener('submit', function(e) {
    let email = document.getElementById('email').value;
    let password = document.getElementById('password').value;
    
    if (!email || !password) {
        e.preventDefault();
        alert('Please fill in all fields');
    }
});
</script>

</body>
</html>
